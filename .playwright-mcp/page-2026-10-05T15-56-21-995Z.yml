            - generic [ref=f11e146]:
              - generic [ref=f11e147]:
                - paragraph [ref=f11e148]: Hi Motrix community 👋
                - paragraph [ref=f11e149]: "I recently built a small open-source CLI wrapper for Motrix:"
                - paragraph [ref=f11e150]:
                  - link "https://github.com/nufegia/motrix-cli" [ref=f11e151] [cursor=pointer]:
                    - /url: https://github.com/nufegia/motrix-cli
                - paragraph [ref=f11e152]: It turns Motrix’s local aria2 JSON-RPC backend into a terminal- and AI-agent-friendly workflow.
                - paragraph [ref=f11e153]: "The idea was simple:"
                - paragraph [ref=f11e154]: Motrix already provides a great GUI download experience, but using it reliably from scripts, terminals, or AI coding agents is still a bit awkward. So I made a lightweight CLI layer on top of it.
                - paragraph [ref=f11e155]: "Features include:"
                - list [ref=f11e156]:
                  - listitem [ref=f11e157]: add downloads from terminal
                  - listitem [ref=f11e158]: list / inspect / pause / resume / remove tasks
                  - listitem [ref=f11e159]: wait until downloads finish
                  - listitem [ref=f11e160]: stable JSON output for automation
                  - listitem [ref=f11e161]: automatic Motrix RPC config discovery on macOS
                  - listitem [ref=f11e162]: reusable Codex skill for AI agents
                - paragraph [ref=f11e163]: "Example:"
                - generic [ref=f11e164]:
                  - generic [ref=f11e165]:
                    - text: motrix-cli add --json
                    - generic [ref=f11e166]: "\"https://example.com/file.zip\""
                    - text: motrix-cli wait --json <gid>
                  - button "Copy code to clipboard" [ref=f11e168] [cursor=pointer]
                - paragraph [ref=f11e172]: "The project is especially designed for workflows involving:"
                - list [ref=f11e173]:
                  - listitem [ref=f11e174]: Codex
                  - listitem [ref=f11e175]: Claude Code
                  - listitem [ref=f11e176]: terminal automation
                  - listitem [ref=f11e177]: MCP / AI agents
                  - listitem [ref=f11e178]: scripting around Motrix
                - paragraph [ref=f11e179]: This is not meant to replace Motrix — only to make the existing Motrix ecosystem easier to automate and integrate into modern AI workflows.
                - paragraph [ref=f11e180]: Would love to hear thoughts or feedback from Motrix users and maintainers 🙂
