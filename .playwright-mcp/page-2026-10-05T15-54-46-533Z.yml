                - paragraph [ref=f5e1483]:
                  - text: The runtime is non-root, supports a read-only root filesystem, validates mount permissions before accepting work, and preserves downloads, sessions, and installed plugins across container replacement. The standard direct-LAN setup publishes the Web service on port 8080 and MDXP on port 16801. Set
                  - code [ref=f5e1484]: MOTRIX_PUBLIC_URL
                  - text: to the Web approval URL that remote clients can actually reach; the Compose files do not substitute a misleading localhost URL.
                - paragraph [ref=f5e1485]: "If the Web approval URL is temporarily unavailable, an SSH operator can list and approve the exact client code without exposing another port:"
                - generic [ref=f5e1486]:
                  - generic [ref=f5e1487]: docker compose exec server motrix-admin pairing pending docker compose exec server motrix-admin pairing approve ABCD-EFGH
                  - button "Copy code to clipboard" [ref=f5e1489] [cursor=pointer]
                - paragraph [ref=f5e1493]:
                  - text: Remote CLI and agent clients pair through the device-code flow. Browser extensions can pair with the headless Server when
                  - code [ref=f5e1494]: MOTRIX_REMOTE_EXTENSION_ENABLED=true
                  - text: and
                  - code [ref=f5e1495]: MOTRIX_REMOTE_EXTENSION_PUBLIC_URL
                  - text: is the WS/WSS address entered in the Extension. HTTPS remains the default operator requirement. A direct trusted-LAN HTTP operator additionally requires
                  - code [ref=f5e1496]: MOTRIX_ALLOW_INSECURE_OPERATOR_HTTP=true
                  - text: and produces a startup warning; never enable it on the Internet or an untrusted LAN. Internet access requires a TLS reverse proxy and firewall rules around the origin ports. See the
                  - link "Docker Server deployment guide" [ref=f5e1497] [cursor=pointer]:
                    - /url: /agalwood/Motrix/blob/main/docs/docker-server.md
                  - text: for ownership setup, Docker Hub/GHCR image and tag selection, DSM 7 and fnOS installation, ports, diagnostics, and backup/upgrade instructions.
