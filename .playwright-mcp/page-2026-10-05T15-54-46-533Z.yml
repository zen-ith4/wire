                - generic [ref=f5e1166]:
                  - heading "Overview" [level=2] [ref=f5e1167]
                  - 'link "Permalink: Overview" [ref=f5e1168] [cursor=pointer]':
                    - /url: "#overview"
                - paragraph [ref=f5e1171]: Motrix is a clean, full-featured desktop download manager for HTTP, FTP, BitTorrent, magnet links, and more.
                - paragraph [ref=f5e1172]:
                  - strong [ref=f5e1173]: Motrix Turbo
                  - text: is Motrix v2, rebuilt from the ground up with Electron, React, and TypeScript while keeping the clean, straightforward experience of v1. The download core is independent of the UI. Browser extensions and command-line tools communicate with the app over
                  - strong [ref=f5e1174]: MDXP
                  - text: (Motrix Download eXchange Protocol), an open protocol built on JSON-RPC 2.0, while plugins run in isolated sandboxes.
                - paragraph [ref=f5e1175]: "The same core powers two ways to run Motrix:"
                - list [ref=f5e1176]:
                  - listitem [ref=f5e1177]:
                    - strong [ref=f5e1178]: "Desktop app:"
                    - text: Runs on macOS, Windows, and Linux
                  - listitem [ref=f5e1179]:
                    - strong [ref=f5e1180]: "Headless server:"
                    - text: Runs without a desktop environment, either directly on Node.js or in Docker, and includes a web UI for NAS devices and home servers
                - generic [ref=f5e1181]:
                  - heading "🧪 Beta testing" [level=2] [ref=f5e1182]
                  - 'link "Permalink: 🧪 Beta testing" [ref=f5e1183] [cursor=pointer]':
                    - /url: "#-beta-testing"
                - paragraph [ref=f5e1186]:
                  - text: Motrix Turbo v2 is currently in beta. After its remaining release gates pass, download
                  - link "v2.0.0-beta.46 from GitHub Releases" [ref=f5e1187] [cursor=pointer]:
                    - /url: https://github.com/agalwood/Motrix/releases/tag/v2.0.0-beta.46
                  - text: and read the
                  - link "full release notes" [ref=f5e1188] [cursor=pointer]:
                    - /url: /agalwood/Motrix/blob/main/docs/release-notes/2.0.0-beta.46.md
                  - text: before installing it.
                - paragraph [ref=f5e1189]: Back up your existing Motrix data and downloads before testing. Migration from Motrix v1 data has not yet been validated, so do not use your only copy of v1 data with this beta. When practical, test v2 in parallel using a separate OS account, machine, or Docker data directory.
