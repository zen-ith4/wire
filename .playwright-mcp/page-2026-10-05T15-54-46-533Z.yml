                    - /url: "#-features"
                - list [ref=f5e1224]:
                  - listitem [ref=f5e1225]: 🕹 Clean, intuitive interface with dark mode
                  - listitem [ref=f5e1226]: 🦄 BitTorrent downloads with per-file selection, plus magnet link support
                  - listitem [ref=f5e1227]: 📡 Built-in tracker list management with automatic updates and health checks
                  - listitem [ref=f5e1228]: 🔌 UPnP and NAT-PMP port mapping
                  - listitem [ref=f5e1229]: 🚥 Upload and download limits with multiple speed-limit profiles
                  - listitem [ref=f5e1230]: 💾 SQLite-backed sessions that restore downloads after a restart
                  - listitem [ref=f5e1231]: 📊 Customizable Dashboard with transfer stats, live activity, and task tiles
                  - listitem [ref=f5e1232]: 🔔 System notifications when downloads finish, plus an in-app notification center
                  - listitem [ref=f5e1233]: 🧩 QuickJS-based plugin sandboxing, fine-grained permissions, and an in-app marketplace
                  - listitem [ref=f5e1234]:
                    - text: 🌐
                    - link "Motrix Extension" [ref=f5e1235] [cursor=pointer]:
                      - /url: https://github.com/motrixapp/motrix-extension
                    - text: for Chrome, Edge, and Firefox hands browser downloads off to Motrix in one click
                  - listitem [ref=f5e1236]:
                    - text: ⌨️ Official
                    - code [ref=f5e1237]: "@motrix/cli"
                    - text: client for everyday shell use and AI agents
                  - listitem [ref=f5e1238]: 🐳 Docker-ready headless server with secure device-code pairing for remote CLI and agent clients
                  - listitem [ref=f5e1239]: 🎬 Extensible URL Resolver plugins for extracting media from supported sites
                  - listitem [ref=f5e1240]: 🤖 System tray integration and launch at startup
                  - listitem [ref=f5e1241]: 🌍 Simplified Chinese and English UI, with more languages planned
                  - listitem [ref=f5e1242]:
                    - text: 🔗 Handlers for
                    - code [ref=f5e1243]: motrix://
                    - text: and
                    - code [ref=f5e1244]: "magnet:"
                    - text: links, plus
                    - code [ref=f5e1245]: .torrent
                    - text: file associations
