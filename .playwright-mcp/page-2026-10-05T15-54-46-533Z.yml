                - paragraph [ref=f5e1448]:
                  - text: The
                  - code [ref=f5e1449]: .AppImage
                  - text: asks on first launch whether to register its desktop entry and URL-scheme handlers under your user data directory; declining leaves your system untouched. You can enable or remove this desktop integration at any time from Settings → Integration. The Snap Store package is strictly confined. Its approved
                  - code [ref=f5e1450]: personal-files
                  - text: interface permits Motrix to register Native Messaging hosts for supported browsers; it does not grant general access to files outside the normal Snap interfaces. Release tags build and validate Flatpak application bundles for both architectures before publication. Older releases, including beta.39, contain only the Flatpak Native Host companion. These single-file bundles require manual upgrades; they do not configure a Motrix update repository. Windows
                  - code [ref=f5e1451]: arm64
                  - text: and all 32-bit packages are not available. Windows
                  - code [ref=f5e1452]: x64
                  - text: packages are unsigned and may trigger a Windows SmartScreen warning.
